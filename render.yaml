services:
  - type: web
    name: fit2101-api
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: fit2101-frontend
    runtime: static
    buildCommand: python scripts/build_frontend.py
    staticPublishPath: dist
