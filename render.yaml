services:
  - type: web
    name: fit2101-api
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: fit2101-frontend
    runtime: static
    buildCommand: python scripts/build_frontend.py
    staticPublishPath: dist
