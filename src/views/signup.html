<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Brand Name</title>
  <link rel="stylesheet" href="../styles/auth.css">
</head>
<body>

  <div class="auth-container">
    <!-- Website Name -->
    <div class="brand-name">Brand Name</div>

    <!-- Blank Profile Picture (SVG Avatar) -->
    <div class="profile-pic">
      <svg viewBox="0 0 24 24">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
    </div>

    <!-- Sign Up Form -->
    <form action="/signup" method="POST">
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
      </div>

      <div class="input-group">
        <label for="confirm password">Confirm Password</label>
        <input type="confirm password" id="confirm password" name="confirm password" placeholder="Confirm your password" required>
      </div>

      <button type="submit" class="btn-submit">Sign In</button>
    </form>

    <!-- Link to Log In Page -->
    <div class="auth-link">
      Have an account? <a href="login.html">Log In</a>
    </div>
  </div>

</body>
</html>
