<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Project</title>

    <!-- PyScript Core -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <!-- Existing layout styles -->
    <link rel="stylesheet" href="../styles/layout.css">

    <!-- Dashboard styles for matching appearance -->
    <link rel="stylesheet" href="../styles/dashboard.css">

    <style>
        .create-project-container {
            max-width: 700px;
            margin: 40px auto;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .create-project-title {
            font-size: 24px;
            font-weight: 600;
            color: #222222;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333333;
            margin-bottom: 8px;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .form-input:focus,
        .form-textarea:focus {
            border-color: #888888;
        }

        .form-textarea {
            min-height: 140px;
            resize: vertical;
        }

        .error-message {
            display: none;
            color: #c92a2a;
            font-size: 13px;
            margin-top: 6px;
        }

        .error-message.show {
            display: block;
        }

        .button-container {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .create-btn,
        .cancel-btn {
            padding: 11px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .create-btn {
            background: #333333;
            color: #ffffff;
        }

        .cancel-btn {
            background: #eeeeee;
            color: #333333;
        }
    </style>
</head>

<body>

    <main class="main-content">

        <div class="create-project-container">

            <h1 class="create-project-title">Create New Project</h1>

            <form id="create-project-form">

                <div class="form-group">
                    <label class="form-label" for="project-name">
                        Project Name
                    </label>

                    <input
                        type="text"
                        id="project-name"
                        class="form-input"
                        placeholder="Enter project name"
                    >

                    <div id="project-name-error" class="error-message"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="project-description">
                        Project Description
                    </label>

                    <textarea
                        id="project-description"
                        class="form-textarea"
                        placeholder="Enter project description"
                    ></textarea>

                    <div id="project-description-error" class="error-message"></div>
                </div>

                <div class="button-container">

                    <button
                        type="submit"
                        id="create-project-submit"
                        class="create-btn"
                    >
                        Create Project
                    </button>

                    <button
                        type="button"
                        id="cancel-project"
                        class="cancel-btn"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </div>

    </main>

    <!-- PyScript backend -->
    <script
        type="py"
        config="../../settings.json"
        src="../backend/create_project.py">
    </script>

</body>
</html>
