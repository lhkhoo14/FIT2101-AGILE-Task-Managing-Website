<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - John Monash</title>

  <!-- PyScript Core CDN -->
  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
  <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
  <!-- CHANGE: open the DNS/TLS connections to the PyScript CDN and the Render API while
       the page is still parsing, so booting Pyodide and the first API fetch do not
       each pay for a separate handshake. -->
  <link rel="preconnect" href="https://pyscript.net" crossorigin>
  <link rel="dns-prefetch" href="https://fit2101-api.onrender.com">

  <link rel="stylesheet" href="../styles/base.css">
  <!-- Top Bar Stylesheet -->
  <link rel="stylesheet" href="../styles/topbar.css">
  <!-- Layout Stylesheet -->
  <link rel="stylesheet" href="../styles/layout.css">
  <!-- Page Stylesheet -->
  <link rel="stylesheet" href="../styles/dashboard.css">
  <!-- Snackbar Stylesheet -->
  <link rel="stylesheet" href="../styles/snackbar.css">
</head>

<body>

  <!-- Top App Bar -->
  <header class="top-app-bar">
    <div class="app-bar-left">
      <button type="button" id="toggle-sidebar-btn" class="icon-btn" aria-label="Toggle Sidebar">
        <!-- Hamburger Menu Icon -->
        <svg viewBox="0 0 24 24" class="icon">
          <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
        </svg>
      </button>
      <span class="brand-title">John Monash</span>
    </div>

    <!-- Rounded Search Bar (Middle) -->
    <div class="search-container">
      <svg viewBox="0 0 24 24" class="search-icon">
        <path
          d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
      </svg>
      <input type="text" id="global-search" class="search-input" placeholder="Search projects or tags...">
    </div>

    <!-- Profile Picture & Dropdown Menu -->
    <div class="profile-menu-container">
      <button type="button" id="profile-menu-btn" class="profile-btn" aria-label="User Profile">
        <div class="profile-avatar">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
          </svg>
        </div>
      </button>

      <!-- Profile Dropdown Menu -->
      <div id="profile-dropdown" class="dropdown-menu hidden">
        <div class="dropdown-header">
          <p id="user-display-name" class="user-name"></p>
          <p id="user-display-email" class="user-email"></p>
        </div>
        <hr>
        <button type="button" id="signout-btn" class="dropdown-item">Sign Out</button>
      </div>
    </div>
  </header>

  <!-- Main Dashboard Layout -->
  <div class="dashboard-layout">

    <!-- Left Sidebar -->
    <aside id="sidebar" class="sidebar">

      <!-- Create New Project Floating Button -->
      <div class="sidebar-action">
        <button type="button" id="create-project-btn" class="btn-create">
          <svg viewBox="0 0 24 24" class="icon">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
          </svg>
          <span>Create</span>
        </button>
      </div>

      <!-- Navigation & Task Filters / Schedule -->
      <nav class="sidebar-nav">
        <button type="button" id="nav-all-projects" class="nav-item active">
          <!-- Folder / Projects Icon -->
          <svg viewBox="0 0 24 24" class="icon">
            <path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z" />
          </svg>
          <span>All Projects</span>
        </button>

        <div class="nav-section-title">Schedule & Tasks</div>

        <button type="button" class="nav-item filter-item">
          <span class="status-dot dot-todo"></span>
          <span>To-Do</span>
        </button>

        <button type="button" class="nav-item filter-item">
          <span class="status-dot dot-wip"></span>
          <span>WIP</span>
        </button>

        <button type="button" class="nav-item filter-item">
          <span class="status-dot dot-review"></span>
          <span>Review</span>
        </button>

        <button type="button" class="nav-item filter-item">
          <span class="status-dot dot-completed"></span>
          <span>Completed</span>
        </button>
      </nav>

      <!-- Settings at Bottom -->
      <div class="sidebar-footer">
        <button type="button" id="settings-btn" class="nav-item">
          <svg viewBox="0 0 24 24" class="icon">
            <path
              d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
          </svg>
          <span>Settings</span>
        </button>
      </div>

    </aside>

    <!-- Main Content Area -->
    <main class="main-content">

      <!-- Top Filters / Sort Area -->
      <div class="content-header">
        <h1 class="page-title">Projects</h1>

        <div class="sort-container">
          <label for="sort-select" class="sort-label">Sort:</label>
          <select id="sort-select" class="sort-dropdown">
            <option value="date">Date</option>
            <option value="priority">Priority</option>
            <option value="name">Name</option>
          </select>
        </div>
      </div>

      <!-- Project Cards Grid -->
      <div class="projects-grid" id="projects-grid">
        <p class="projects-loading">Loading projects...</p>
      </div>

    </main>
  </div>

  <div id="snackbar">Some text some message..</div>
  <!-- Link settings.json for PyScript backend -->
  <script type="py" config="../../settings.json" src="../backend/layout.py"></script>
  <script type="py" config="../../settings.json" src="../backend/dashboard.py"></script>
</body>

</html>
