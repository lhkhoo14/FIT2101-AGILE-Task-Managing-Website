<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - John Monash</title>

  <!-- Include PyScript CSS & JS from CDN -->
  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
  <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
  <link rel="preconnect" href="https://pyscript.net" crossorigin>
  <link rel="dns-prefetch" href="https://fit2101-api.onrender.com">

  <!-- Page Stylesheet -->
  <link rel="stylesheet" href="../styles/auth.css?v=20261012">
  <!-- Snackbar Stylesheet -->
  <link rel="stylesheet" href="../styles/snackbar.css">
</head>
<body>

  <div class="auth-container">
    <!-- US-33: Organisation Branding -->
    <div class="brand-name brand">
      <img class="brand-logo" src="../assets/logo.png" alt="John Monash" onerror="this.parentNode.classList.add('brand-text-only'); this.remove();">
      <span class="brand-wordmark">John Monash</span>
    </div>

    <h2>Reset Password</h2>
    <p style="color: #64748b; font-size: 14px; margin-bottom: 20px;">Enter your email to request a reset code.</p>

    <form id="forgot-password-form" onsubmit="event.preventDefault();">
      <!-- Step 1: Email & Send Code Button -->
      <div class="input-group">
        <label for="email">Email</label>
        <div style="display: flex; gap: 8px;">
          <input id="email" name="email" placeholder="Enter your email" required style="flex: 1;">
          <button type="button" id="send-code-btn" class="submit-btn" style="margin-top: 0; width: auto; padding: 12px 16px; font-size: 14px; white-space: nowrap;">Send Code</button>
        </div>
        <span id="email-error" class="error-message"></span>
      </div>

      <!-- Step 2: Hidden initially until code is sent -->
      <div id="reset-fields-container" class="hidden">
        <div class="input-group">
          <label for="verification-code">Verification Code</label>
          <input id="verification-code" name="code" placeholder="e.g. A9B2C3" maxlength="6" style="text-transform: uppercase; letter-spacing: 2px; font-family: monospace;">
          <span id="code-error" class="error-message"></span>
        </div>

        <div class="input-group">
          <label for="new-password">New Password</label>
          <div class="password-wrapper">
            <input type="password" id="new-password" name="new-password" placeholder="Enter new password">
            <button type="button" id="toggle-password" class="toggle-password-btn" aria-label="Toggle password visibility">
              <svg id="eye-icon" class="eye-icon" viewBox="0 0 24 24">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
              </svg>
              <svg id="eye-off-icon" class="eye-icon hidden" viewBox="0 0 24 24">
                <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.17c0-1.66-1.34-3-3-3l-.17.02z"/>
              </svg>
            </button>
          </div>
          <span id="password-error" class="error-message"></span>
        </div>

        <div class="input-group">
          <label for="confirm-password">Confirm New Password</label>
          <div class="password-wrapper">
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm new password">
            <button type="button" id="toggle-confirm-password" class="toggle-password-btn" aria-label="Toggle password visibility">
              <svg id="confirm-eye-icon" class="eye-icon" viewBox="0 0 24 24">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
              </svg>
              <svg id="confirm-eye-off-icon" class="eye-icon hidden" viewBox="0 0 24 24">
                <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.17c0-1.66-1.34-3-3-3l-.17.02z"/>
              </svg>
            </button>
          </div>
          <span id="confirm-password-error" class="error-message"></span>
        </div>

        <button type="submit" id="reset-btn" class="submit-btn">Reset Password</button>
      </div>

      <div id="snackbar"></div>
    </form>

    <div class="auth-link" style="margin-top: 20px;">
      Remembered your password? <a href="login.html">Log In</a>
    </div>
  </div>

  <!-- Link your settings.json configuration -->
  <script type="py" config="../../settings.json" src="../backend/views/forgot_password.py"></script>

</body>
</html>
