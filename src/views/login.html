<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Brand Name</title>

  <!-- 1. Include PyScript CSS & JS from CDN -->
  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
  <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

  <link rel="stylesheet" href="../styles/auth.css">
</head>
<body>

  <div class="auth-container">
    <div class="brand-name">Brand Name</div>

    <div class="profile-pic">
      <svg viewBox="0 0 24 24">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
    </div>

    <!-- Added inline onsubmit preventDefault safeguard -->
    <form id="login-form" onsubmit="event.preventDefault();">
      <div class="input-group">
        <label for="email">Email</label>
        <input id="email" name="email" placeholder="Enter your email" required>
        <span id="email-error" class="error-message"></span>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
        <span id="password-error" class="error-message"></span>
      </div>

      <button type="submit" id="login-button" class="btn-submit">Sign In</button>
      <div id="snackbar">Some text some message..</div>
    </form>

    <!-- Link to Sign Up Page -->
    <div class="auth-link">
      Don't have an account? <a href="signup.html">Sign Up</a>
    </div>
  </div>
  
  <!-- 2. Link your settings.json configuration -->
  <script type="py" config="../../settings.json" src="../backend/login.py"></script>

</body>
</html>
