<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - John Monash</title>

  <!-- Include PyScript CSS & JS from CDN -->
  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
  <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
  <!-- CHANGE: open the DNS/TLS connections to the PyScript CDN and the Render API while
       the page is still parsing, so booting Pyodide and the first API fetch do not
       each pay for a separate handshake. -->
  <link rel="preconnect" href="https://pyscript.net" crossorigin>
  <link rel="dns-prefetch" href="https://fit2101-api.onrender.com">

  <!-- Page Stylesheet -->
  <link rel="stylesheet" href="../styles/auth.css?v=20261012">
  <!-- Snackbar Stylesheet -->
  <link rel="stylesheet" href="../styles/snackbar.css">
</head>
<body>

  <div class="auth-container">
    <!-- US-33: the organisation's branding, in the same position as the navigation
         header. The wordmark is the accessible name and the fallback if the asset
         is missing. -->
    <div class="brand-name brand">
      <img class="brand-logo" src="../assets/logo.png" alt="John Monash" onerror="this.parentNode.classList.add('brand-text-only'); this.remove();">
      <span class="brand-wordmark">John Monash</span>
    </div>

    <!-- Added inline onsubmit preventDefault safeguard -->
    <form id="login-form" onsubmit="event.preventDefault();">
      <div class="input-group">
        <label for="email">Email</label>
        <input id="email" name="email" placeholder="Enter your email" required>
        <span id="email-error" class="error-message"></span>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" placeholder="Enter your password">
          <button type="button" id="toggle-password" class="toggle-password-btn" aria-label="Toggle password visibility">
            <!-- Eye Icon (Visible state) -->
            <svg id="eye-icon" class="eye-icon" viewBox="0 0 24 24">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
            <!-- Eye Off Icon (Hidden state) -->
            <svg id="eye-off-icon" class="eye-icon hidden" viewBox="0 0 24 24">
              <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.17c0-1.66-1.34-3-3-3l-.17.02z"/>
            </svg>
          </button>
        </div>
        <span id="password-error" class="error-message"></span>
      </div>

      <button type="submit" id="login-btn" class="submit-btn">Sign In</button>
      <div id="snackbar">Some text some message..</div>
    </form>

    <!-- Link to Sign Up Page -->
    <div class="auth-link">
      Don't have an account? <a href="signup.html">Sign Up</a>
    </div>
  </div>
  
  <!-- Link your settings.json configuration -->
  <script type="py" config="../../settings.json" src="../backend/login.py"></script>

</body>
</html>
