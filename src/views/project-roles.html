<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Roles - John Monash</title>

    <!-- PyScript Core CDN -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link rel="preconnect" href="https://pyscript.net" crossorigin>
    <link rel="dns-prefetch" href="https://fit2101-api.onrender.com">

    <link rel="stylesheet" href="../styles/base.css">
    <!-- Top Bar Stylesheet -->
    <link rel="stylesheet" href="../styles/topbar.css?v=20261011">
    <!-- Layout Stylesheet -->
    <link rel="stylesheet" href="../styles/project-layout.css">
    <link rel="stylesheet" href="../styles/project-roles.css">
    <!-- Snackbar Stylesheet -->
    <link rel="stylesheet" href="../styles/snackbar.css">
</head>

<body>
    <header class="top-app-bar">
        <div class="app-bar-left">
            <button type="button" id="toggle-sidebar-btn" class="icon-btn" aria-label="Toggle Sidebar">
                <svg viewBox="0 0 24 24" class="icon">
                    <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
                </svg>
            </button>
            <span class="brand-title brand" title="Go to dashboard">
                <img class="brand-logo" src="../assets/logo.png" alt="John Monash" onerror="this.parentNode.classList.add('brand-text-only'); this.remove();">
                <span class="brand-wordmark">John Monash</span>
            </span>
        </div>

        <!-- Rounded Search Bar (Middle) -->
        <div class="search-container">
            <svg viewBox="0 0 24 24" class="search-icon">
                <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
            </svg>
            <input type="text" id="global-search" class="search-input" placeholder="Search projects or tags...">
        </div>

        <!-- Profile Picture & Dropdown Menu -->
        <div class="profile-menu-container">
            <button type="button" id="profile-menu-btn" class="profile-btn" aria-label="User Profile">
                <div class="profile-avatar">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                    </svg>
                </div>
            </button>

            <div id="profile-dropdown" class="dropdown-menu hidden">
                <div class="dropdown-header">
                    <p id="user-display-name" class="user-name"></p>
                    <p id="user-display-email" class="user-email"></p>
                </div>
                <hr>
                <button type="button" id="signout-btn" class="dropdown-item">Sign Out</button>
            </div>
        </div>
    </header>

    <div class="dashboard-layout">
        <aside id="project-sidebar" class="sidebar project-sidebar">
            <nav class="sidebar-nav">
                <button type="button" id="nav-projects" class="nav-item nav-projects">
                  <svg viewBox="0 0 24 24" class="icon"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
                  <span>Projects</span>
                </button>

                <div class="nav-section-title">Views</div>

                <button type="button" id="nav-description" class="nav-item">
                    <svg viewBox="0 0 24 24" class="icon">
                        <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z" />
                    </svg>
                    <span>Description</span>
                </button>

                <button type="button" id="nav-members" class="nav-item" title="Members">
                    <svg viewBox="0 0 24 24" class="icon">
                        <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" />
                    </svg>
                    <span>Members</span>
                </button>

                <button type="button" id="nav-roles" class="nav-item active" title="Roles">
                    <svg viewBox="0 0 24 24" class="icon">
                        <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" />
                    </svg>
                    <span>Roles</span>
                </button>

                <button type="button" id="nav-sprints" class="nav-item">
                    <svg viewBox="0 0 24 24" class="icon">
                        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z" />
                    </svg>
                    <span>Sprints</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <button type="button" id="settings-btn" class="nav-item">
                    <svg viewBox="0 0 24 24" class="icon">
                        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c-.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6-3.6z" />
                    </svg>
                    <span>Settings</span>
                </button>
            </div>
        </aside>

        <!-- Main content area -->
        <main id="project-view-content" class="main-content">
            <div class="content-header">
                <div>
                    <h1 class="page-title">Project Roles</h1>
                    <p class="page-subtitle">Configure custom roles, permissions, and restrictions.</p>
                </div>
                <div class="roles-action-bar" style="display: flex; gap: 12px; align-items: center;">
                    <input type="text" id="role-search-input" class="search-input" placeholder="Search roles by name or description...">
                    <button type="button" id="open-create-role-modal" class="create-role-btn">+ Create Role</button>
                </div>
            </div>
            <div id="roles-cards-container" class="roles-cards-container" style="margin-top: 20px;">
                <p class="empty-roles">Loading roles...</p>
            </div>
        </main>

        <!-- Create Role Modal Overlay -->
        <div id="create-role-modal" class="modal-overlay hidden">
            <div class="modal-box" onsubmit="event.preventDefault();">
                <h2 class="modal-title">Create Custom Role</h2>
                <form id="create-role-form">
                    <label class="modal-label" for="role-name-input">Role Name</label>
                    <input type="text" id="role-name-input" class="modal-input" required>

                    <label class="modal-label" for="role-colour-input">Role Colour</label>
                    <input type="color" id="role-colour-input" class="modal-input-color" value="#4F46E5">

                    <label class="modal-label" for="role-desc-input">Description (Optional)</label>
                    <textarea id="role-desc-input" class="modal-textarea"></textarea>

                    <div class="modal-label">Permissions</div>
                    <div class="permissions-checklist">
                        <label><input type="checkbox" class="role-permission-checkbox" value="add_members"> Add Members</label>
                        <label><input type="checkbox" class="role-permission-checkbox" value="manage_sprints"> Manage Sprints</label>
                        <label><input type="checkbox" class="role-permission-checkbox" value="manage_roles"> Manage Roles</label>
                    </div>

                    <div class="modal-label">Conflicting Roles (Mutually Exclusive)</div>
                    <div id="role-conflicts-list" class="conflicts-checklist">
                        <!-- Dynamically populated -->
                    </div>

                    <div class="modal-actions">
                        <button type="button" class="modal-btn-cancel" data-modal="create-role-modal">Cancel</button>
                        <button type="submit" class="modal-btn-submit">Create Role</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="snackbar">Some text some message..</div>

    <!-- Link settings.json for PyScript backend -->
    <script type="py" config="../../settings.json" src="../backend/utils/project_layout.py?v=20261011"></script>
    <script type="py" config="../../settings.json" src="../backend/views/project_roles.py"></script>
</body>

</html>
