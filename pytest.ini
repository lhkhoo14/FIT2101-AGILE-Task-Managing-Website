[pytest]
testpaths = tests
# The server uses bare imports (`from database_manager import ...`), so server/ has
# to be importable as a top-level folder, while the tests import it as `server.x`.
pythonpath = . server
markers =
    unit: pure logic, no HTTP
    api: drives the FastAPI app through TestClient
addopts = -q --cov --cov-config=.coveragerc --cov-report=term-missing:skip-covered
filterwarnings =
    ignore::DeprecationWarning